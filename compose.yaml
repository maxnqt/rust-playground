name: rust-playground

services:
  rust:
    build:
      context: .
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: rust-playground-dev
    container_name: rust-playground
    hostname: rust-playground
    working_dir: /workspace
    environment:
      TERM: xterm-256color
      COLORTERM: truecolor
    volumes:
      - .:/workspace                               # your code, live-synced
      - cargo-registry:/usr/local/cargo/registry   # cache downloaded crates
      - cargo-git:/usr/local/cargo/git             # cache git dependencies
      - shell-history:/home/dev/.history           # keep bash history between sessions
      - ./docker/starship.toml:/home/dev/.config/starship.toml:ro   # prompt edits apply without a rebuild
    # ports:
    #   - "8080:8080"   # uncomment for web examples
    init: true
    command: sleep infinity   # keep the container alive; you exec into it

volumes:
  cargo-registry:
  cargo-git:
  shell-history:
